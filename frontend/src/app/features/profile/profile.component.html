<div class="profile-page">
  @if (currentUser()) {
    <app-profile-banner
      [coverImageUrl]="coverImageUrl()"
      [profileImageUrl]="profileImageUrl()"
      [userInitials]="userInitials()"
      [isUploadingCover]="isUploadingCover()"
      [isUploadingProfile]="isUploadingProfile()"
      (coverImageSelected)="onCoverImageSelected($event)"
      (profileImageSelected)="onProfileImageSelected($event)"
    ></app-profile-banner>

    <div class="profile-info-card">
      @if (!isEditing()) {
        <app-profile-info
          [user]="currentUser()!"
          [memberSince]="memberSince()"
          (editClicked)="startEditing()"
          (logoutClicked)="logout()"
        ></app-profile-info>
      } @else {
        <app-profile-edit-form
          [profileForm]="profileForm"
          [exactMemberSince]="exactMemberSince()"
          [isSaving]="isSaving()"
          (cancel)="cancelEditing()"
          (save)="saveProfile()"
        ></app-profile-edit-form>
      }
    </div>

    <div class="section-card">
      <app-profile-borrowed-tools
        [borrowedTools]="borrowedTools()"
      ></app-profile-borrowed-tools>
    </div>

    <!-- Quick Tips Section -->
    <div class="section-card tips-card">
      <h2 class="section-title"><span class="section-icon">🌟</span> Neighbor Tips</h2>
      <div class="tips-grid">
        <div class="tip">
          <span class="tip-icon">🤝</span>
          <p>Share items you don't use daily to help your community</p>
        </div>
        <div class="tip">
          <span class="tip-icon">🚗</span>
          <p>Share your parking spot when you're away on vacation</p>
        </div>
        <div class="tip">
          <span class="tip-icon">📣</span>
          <p>Create events to bring your neighbors together</p>
        </div>
      </div>
    </div>
  }
</div>
