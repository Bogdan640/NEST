<div class="table-container ag-theme-quartz" style="height: calc(100vh - 280px); width: 100%;">
  <ag-grid-angular
    style="width: 100%; height: 100%;"
    [rowData]="residents()"
    [columnDefs]="columnDefs"
    [theme]="theme"
    [rowHeight]="56"
    [headerHeight]="48"
    [quickFilterText]="quickFilterText()"
    [pagination]="true"
    [paginationPageSize]="10"
    [paginationPageSizeSelector]="[10, 25, 50]"
    (gridReady)="onGridReady($event)"
    (cellClicked)="onCellClicked($event)"
  />
</div>

<ng-template #listDialog>
  <div class="modal-card-container no-hover-effect" style="padding: 1.5rem; background: var(--card-bg); border-radius: 1rem; color: var(--text-primary);">
    <div class="modal-header-actions" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
      <h3 style="margin: 0; font-size: 1.25rem; font-weight: 600;">{{ dialogTitle() }}</h3>
      <button class="btn-icon close-btn" mat-dialog-close title="Close" style="background: none; border: none; font-size: 1.25rem; cursor: pointer; color: var(--text-secondary);">✕</button>
    </div>
    
    <div class="list-container" style="max-height: 60vh; overflow-y: auto;">
      <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 0.75rem;">
        @for (item of dialogItems(); track item.id) {
          <li style="padding: 1rem; background: var(--bg-default); border: 1px solid var(--card-border); border-radius: 8px;">
            <div style="font-weight: 500; font-size: 1rem;">{{ item.name }}</div>
            @if (item.subtitle) {
              <div style="font-size: 0.875rem; color: var(--text-secondary); margin-top: 0.25rem;">{{ item.subtitle }}</div>
            }
          </li>
        }
      </ul>
    </div>
  </div>
</ng-template>
