<div class="animal-logo" [class]="size">
  <div class="icon-container">
    @if (animal === 'BIRD') {
      <span class="icon">🐦</span>
    } @else if (animal === 'BEAR') {
      <span class="icon">🐻</span>
    } @else if (animal === 'FOX') {
      <span class="icon">🦊</span>
    } @else {
      <span class="icon">🦝</span>
    }
  </div>
  <div class="brand">
    <span class="name">NEST</span>
    <span class="subtitle">Community</span>
  </div>
</div>
